<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Task 5.1 - SVG Graphical Art</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 32px 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f6f7f9;
      color: #222;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }
    p.subtitle {
      margin: 0 0 28px;
      color: #555;
      font-size: 0.95rem;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      max-width: 1120px;
      margin: 0 auto;
    }
    .art-card {
      background: #ffffff;
      padding: 14px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.07);
      width: 228px;
    }
    .art-card svg {
      display: block;
      width: 200px;
      height: 300px;
      margin: 0 auto;
      background-color: #fafafa;
    }
    .art-title {
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Learning Task 5.1: 7 SVG Graphical Arts</h1>
  <p class="subtitle">Each graphic is 200&times;300 using required SVG element combinations.</p>

  <div class="gallery">
    <!-- 1. Line and Circle -->
    <div class="art-card">
      <svg id="art-1" width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
        <line x1="40" y1="0" x2="40" y2="300" stroke="#e98a7c" stroke-width="2" />
        <line x1="115" y1="0" x2="115" y2="300" stroke="#e98a7c" stroke-width="2" />
        <line x1="0" y1="95" x2="200" y2="95" stroke="#e98a7c" stroke-width="2" />
        <line x1="0" y1="215" x2="200" y2="215" stroke="#e98a7c" stroke-width="2" />

        <circle cx="52" cy="48" r="34" fill="#18a5a7" />
        <circle cx="52" cy="48" r="18" fill="#ffffff" />
        <circle cx="52" cy="48" r="9" fill="#18a5a7" />

        <circle cx="132" cy="42" r="24" fill="#e98a7c" />
        <circle cx="132" cy="42" r="11" fill="#ffffff" />

        <circle cx="136" cy="138" r="38" fill="#18a5a7" />
        <circle cx="136" cy="138" r="22" fill="#ffffff" />
        <circle cx="136" cy="138" r="11" fill="#18a5a7" />

        <circle cx="54" cy="248" r="28" fill="#18a5a7" />
        <circle cx="54" cy="248" r="14" fill="#ffffff" />
        <circle cx="54" cy="248" r="7" fill="#18a5a7" />

        <circle cx="128" cy="252" r="26" fill="#18a5a7" />
        <circle cx="128" cy="252" r="13" fill="#ffffff" />
        <circle cx="128" cy="252" r="6" fill="#e98a7c" />
      </svg>
      <div class="art-title">1. Line and Circle</div>
    </div>

    <!-- 2. Circle and Rectangle -->
    <div class="art-card">
      <svg id="art-2" width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="200" height="300" fill="#f39c8d" />
        <rect x="0" y="20" width="200" height="72" fill="#14a098" />
        <rect x="0" y="112" width="200" height="72" fill="#14a098" />
        <rect x="0" y="204" width="200" height="72" fill="#14a098" />
        <rect x="0" y="92" width="200" height="8" fill="#f5b041" />
        <rect x="0" y="184" width="200" height="8" fill="#f5b041" />

        <circle cx="32" cy="56" r="11" fill="#f39c8d" />
        <circle cx="76" cy="56" r="11" fill="#f39c8d" />
        <circle cx="120" cy="56" r="11" fill="#f39c8d" />
        <circle cx="164" cy="56" r="11" fill="#f39c8d" />

        <circle cx="54" cy="148" r="11" fill="#f39c8d" />
        <circle cx="98" cy="148" r="11" fill="#f39c8d" />
        <circle cx="142" cy="148" r="11" fill="#f39c8d" />

        <circle cx="32" cy="240" r="11" fill="#f39c8d" />
        <circle cx="76" cy="240" r="11" fill="#f39c8d" />
        <circle cx="120" cy="240" r="11" fill="#f39c8d" />
        <circle cx="164" cy="240" r="11" fill="#f39c8d" />
      </svg>
      <div class="art-title">2. Circle and Rectangle</div>
    </div>

    <!-- 3. Polyline and Circle -->
    <div class="art-card">
      <svg id="art-3" width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="200" height="300" fill="#ffffff" />

        <polyline points="0,30 25,65 50,30 75,65 100,30 125,65 150,30 175,65 200,30" fill="none" stroke="#f5b027" stroke-width="14" stroke-linejoin="miter" />
        <polyline points="0,68 25,103 50,68 75,103 100,68 125,103 150,68 175,103 200,68" fill="none" stroke="#17a598" stroke-width="14" stroke-linejoin="miter" />
        <polyline points="0,106 25,141 50,106 75,141 100,106 125,141 150,106 175,141 200,106" fill="none" stroke="#ef8a7a" stroke-width="14" stroke-linejoin="miter" />
        <polyline points="0,144 25,179 50,144 75,179 100,144 125,179 150,144 175,179 200,144" fill="none" stroke="#6c584c" stroke-width="14" stroke-linejoin="miter" />
        <polyline points="0,182 25,217 50,182 75,217 100,182 125,217 150,182 175,217 200,182" fill="none" stroke="#ef8a7a" stroke-width="14" stroke-linejoin="miter" />
        <polyline points="0,220 25,255 50,220 75,255 100,220 125,255 150,220 175,255 200,220" fill="none" stroke="#17a598" stroke-width="14" stroke-linejoin="miter" />
        <polyline points="0,258 25,293 50,258 75,293 100,258 125,293 150,258 175,293 200,258" fill="none" stroke="#f5b027" stroke-width="14" stroke-linejoin="miter" />

        <circle cx="50" cy="48" r="8" fill="#ffffff" />
        <circle cx="150" cy="48" r="8" fill="#ffffff" />
        <circle cx="25" cy="124" r="8" fill="#17a598" />
        <circle cx="125" cy="124" r="8" fill="#17a598" />
        <circle cx="75" cy="200" r="8" fill="#ffffff" />
        <circle cx="175" cy="200" r="8" fill="#ffffff" />
        <circle cx="50" cy="276" r="8" fill="#17a598" />
        <circle cx="150" cy="276" r="8" fill="#17a598" />
      </svg>
      <div class="art-title">3. Polyline and Circle</div>
    </div>

    <!-- 4. Polygon and Ellipse -->
    <div class="art-card">
      <svg id="art-4" width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,0 200,0 200,300 0,300" fill="#f39c8d" />
        <polygon points="0,22 25,54 50,22 75,54 100,22 125,54 150,22 175,54 200,22 200,38 175,70 150,38 125,70 100,38 75,70 50,38 25,70 0,38" fill="#16a095" />
        <polygon points="0,56 25,88 50,56 75,88 100,56 125,88 150,56 175,88 200,56 200,72 175,104 150,72 125,104 100,72 75,104 50,72 25,104 0,72" fill="#f5b027" />
        <polygon points="0,204 25,236 50,204 75,236 100,204 125,236 150,204 175,236 200,204 200,220 175,252 150,220 125,252 100,220 75,252 50,220 25,252 0,220" fill="#16a095" />
        <polygon points="0,238 25,270 50,238 75,270 100,238 125,270 150,238 175,270 200,238 200,254 175,286 150,254 125,286 100,254 75,286 50,254 25,286 0,254" fill="#f5b027" />

        <ellipse cx="32" cy="148" rx="18" ry="30" fill="#ffffff" />
        <ellipse cx="100" cy="148" rx="18" ry="30" fill="#a59690" />
        <ellipse cx="168" cy="148" rx="18" ry="30" fill="#ffffff" />
      </svg>
      <div class="art-title">4. Polygon and Ellipse</div>
    </div>

    <!-- 5. Circle, Line and Rectangle -->
    <div class="art-card">
      <svg id="art-5" width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="200" height="300" fill="#ef8a7a" />
        <rect x="0" y="18" width="200" height="34" fill="#16a095" />
        <rect x="0" y="108" width="200" height="34" fill="#16a095" />
        <rect x="0" y="198" width="200" height="34" fill="#16a095" />

        <line x1="25" y1="0" x2="25" y2="300" stroke="#ef8a7a" stroke-width="5" />
        <line x1="62" y1="0" x2="62" y2="300" stroke="#ef8a7a" stroke-width="5" />
        <line x1="100" y1="0" x2="100" y2="300" stroke="#ef8a7a" stroke-width="5" />
        <line x1="138" y1="0" x2="138" y2="300" stroke="#ef8a7a" stroke-width="5" />
        <line x1="175" y1="0" x2="175" y2="300" stroke="#ef8a7a" stroke-width="5" />

        <circle cx="25" cy="78" r="10" fill="#16a095" />
        <circle cx="62" cy="78" r="10" fill="#f5b027" />
        <circle cx="100" cy="78" r="10" fill="#16a095" />
        <circle cx="138" cy="78" r="10" fill="#f5b027" />
        <circle cx="175" cy="78" r="10" fill="#16a095" />

        <circle cx="25" cy="168" r="10" fill="#f5b027" />
        <circle cx="62" cy="168" r="10" fill="#16a095" />
        <circle cx="100" cy="168" r="10" fill="#f5b027" />
        <circle cx="138" cy="168" r="10" fill="#16a095" />
        <circle cx="175" cy="168" r="10" fill="#f5b027" />

        <circle cx="25" cy="258" r="10" fill="#16a095" />
        <circle cx="62" cy="258" r="10" fill="#f5b027" />
        <circle cx="100" cy="258" r="10" fill="#16a095" />
        <circle cx="138" cy="258" r="10" fill="#f5b027" />
        <circle cx="175" cy="258" r="10" fill="#16a095" />
      </svg>
      <div class="art-title">5. Circle, Line and Rectangle</div>
    </div>

    <!-- 6. Polyline and Polygon -->
    <div class="art-card">
      <svg id="art-6" width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,0 200,0 200,300 0,300" fill="#ef8a7a" />
        <polygon points="100,12 142,54 100,96 58,54" fill="#16a095" />
        <polygon points="100,108 142,150 100,192 58,150" fill="#16a095" />
        <polygon points="100,204 142,246 100,288 58,246" fill="#16a095" />

        <polyline points="12,18 46,54 12,90 46,126 12,162 46,198 12,234 46,270 12,294" fill="none" stroke="#16a095" stroke-width="11" stroke-linejoin="miter" />
        <polyline points="188,18 154,54 188,90 154,126 188,162 154,198 188,234 154,270 188,294" fill="none" stroke="#16a095" stroke-width="11" stroke-linejoin="miter" />
      </svg>
      <div class="art-title">6. Polyline and Polygon</div>
    </div>

    <!-- 7. Circle, Rectangle, Polyline, Polygon and Ellipse -->
    <div class="art-card">
      <svg id="art-7" width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="200" height="300" fill="#ef8a7a" />
        <rect x="0" y="0" width="200" height="190" fill="#16a095" />

        <polygon points="100,20 165,130 35,130" fill="#ef8a7a" />
        <polygon points="0,190 25,215 50,190 75,215 100,190 125,215 150,190 175,215 200,190 200,205 175,230 150,205 125,230 100,205 75,230 50,205 25,230 0,205" fill="#7f6a63" />

        <polyline points="0,242 25,267 50,242 75,267 100,242 125,267 150,242 175,267 200,242" fill="none" stroke="#7f6a63" stroke-width="12" stroke-linejoin="miter" />
        <polyline points="0,274 25,299 50,274 75,299 100,274 125,299 150,274 175,299 200,274" fill="none" stroke="#f5b027" stroke-width="12" stroke-linejoin="miter" />

        <ellipse cx="100" cy="112" rx="48" ry="26" fill="#7f6a63" />

        <circle cx="36" cy="54" r="14" fill="#ef8a7a" />
        <circle cx="164" cy="54" r="14" fill="#ef8a7a" />
        <circle cx="100" cy="112" r="12" fill="#f5b027" />
      </svg>
      <div class="art-title">7. All 5 Elements Combined</div>
    </div>
  </div>
</body>
</html>
