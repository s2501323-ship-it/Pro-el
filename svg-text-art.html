<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Task 6.1 - SVG Text Art</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px;
      background-color: #f4f6f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #1e293b;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }
    p {
      margin: 0 0 18px;
      font-size: 0.95rem;
      color: #475569;
    }
    .canvas-wrap {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      overflow: auto;
      max-width: 100%;
    }
    svg {
      display: block;
      width: 900px;
      height: 780px;
    }
  </style>
</head>
<body>
  <h1>Learning Task 6.1: SVG Text Art</h1>
  <p>Text placed along curved SVG paths forming a beacon &amp; wave symbol (900&times;780).</p>

  <div class="canvas-wrap">
    <svg id="text-art" width="900" height="780" viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Outer circular frame path -->
        <path id="outer-circle-path" d="M 450, 75 A 315, 315 0 1, 1 449.9, 75" fill="none" />

        <!-- Upper-left sweeping beacon ray -->
        <path id="ray-left-path" d="M 450, 360 C 350, 295 235, 225 135, 195" fill="none" />

        <!-- Upper-right sweeping beacon ray -->
        <path id="ray-right-path" d="M 450, 360 C 550, 295 665, 225 765, 195" fill="none" />

        <!-- Central rising flame / beam arc -->
        <path id="center-arc-path" d="M 355, 445 Q 450, 165 545, 445" fill="none" />

        <!-- Lower sweeping wave path -->
        <path id="wave-path" d="M 170, 520 C 265, 455 365, 585 450, 520 C 535, 455 635, 585 730, 520" fill="none" />

        <!-- Bottom horizon arc path -->
        <path id="bottom-arc-path" d="M 225, 600 Q 450, 695 675, 600" fill="none" />
      </defs>

      <!-- Subtle background -->
      <rect x="0" y="0" width="900" height="780" fill="#fafbfd" />

      <!-- Decorative guide paths (low opacity so text stays crisp and readable) -->
      <use href="#outer-circle-path" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6" />
      <use href="#ray-left-path" stroke="#99f6e4" stroke-width="2" />
      <use href="#ray-right-path" stroke="#99f6e4" stroke-width="2" />
      <use href="#center-arc-path" stroke="#fed7aa" stroke-width="2" />
      <use href="#wave-path" stroke="#bae6fd" stroke-width="2.5" />
      <use href="#bottom-arc-path" stroke="#e2e8f0" stroke-width="2" />

      <!-- Text along paths -->
      <text fill="#0f766e" font-size="18" font-weight="700" letter-spacing="3">
        <textPath href="#outer-circle-path" startOffset="4%">
          CODE WITH CURIOSITY • BUILD WITH PURPOSE • LET EVERY LINE LIGHT THE WAY FORWARD •
        </textPath>
      </text>

      <text fill="#0d9488" font-size="16" font-weight="600" letter-spacing="1.5">
        <textPath href="#ray-left-path" startOffset="6%">
          curiosity sparks the first line
        </textPath>
      </text>

      <text fill="#0d9488" font-size="16" font-weight="600" letter-spacing="1.5">
        <textPath href="#ray-right-path" startOffset="8%">
          purpose guides every step
        </textPath>
      </text>

      <text fill="#ea580c" font-size="20" font-weight="700" letter-spacing="2">
        <textPath href="#center-arc-path" startOffset="12%">
          LIGHT THE WAY FORWARD
        </textPath>
      </text>

      <text fill="#0369a1" font-size="17" font-weight="600" letter-spacing="1.2">
        <textPath href="#wave-path" startOffset="5%">
          through every tide and turn, keep building with care
        </textPath>
      </text>

      <text fill="#334155" font-size="16" font-weight="600" letter-spacing="2">
        <textPath href="#bottom-arc-path" startOffset="16%">
          CRAFT • CLARITY • MOMENTUM
        </textPath>
      </text>
    </svg>
  </div>
</body>
</html>
